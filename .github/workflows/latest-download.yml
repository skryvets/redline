name: Latest download

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to repair, for example v0.4.0
        required: true

permissions:
  contents: write

jobs:
  attach:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - run: |
          gh release download "$TAG" --pattern "Redline-${TAG#v}-arm64.dmg" --output Redline-arm64.dmg
          gh release upload "$TAG" Redline-arm64.dmg --clobber
